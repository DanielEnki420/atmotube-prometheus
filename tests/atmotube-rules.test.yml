# promtool unit tests for prometheus/atmotube-rules.yml
#
#   promtool test rules tests/atmotube-rules.test.yml
#
# promtool starts its clock at 0, so time() is simply the minutes elapsed.
# Each rule gets a case where it must stay quiet and one where it must fire -
# a rule that never fires passes "stays quiet" just as well.
rule_files:
  - ../prometheus/atmotube-rules.yml

evaluation_interval: 1m

tests:
  # Exporter alive: heartbeat moves on every minute, readings arrive.
  - interval: 1m
    input_series:
      - series: atmotube_last_run_timestamp_seconds
        values: "0+60x60"
      - series: atmotube_last_reading_timestamp_seconds
        values: "0+60x60"
    alert_rule_test:
      - eval_time: 60m
        alertname: AtmotubeExporterStalled
        exp_alerts: []
      - eval_time: 60m
        alertname: AtmotubeNoReadings
        exp_alerts: []

  # Exporter stopped at minute 0: its last file stays behind with an old
  # heartbeat. More than 300 s old from minute 6, plus "for: 5m".
  - interval: 1m
    input_series:
      - series: atmotube_last_run_timestamp_seconds
        values: "0x60"
      - series: atmotube_last_reading_timestamp_seconds
        values: "0+60x60"
    alert_rule_test:
      - eval_time: 10m
        alertname: AtmotubeExporterStalled
        exp_alerts: []
      - eval_time: 12m
        alertname: AtmotubeExporterStalled
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: "atmotube exporter has not written for over 5 minutes"
              description: "systemctl status atmotube; journalctl -u atmotube -n 30. If you stopped it on purpose, delete the .prom file - otherwise this rule is right to fire."

  # Exporter runs, but the last reading is from minute 0 (phone app holds the
  # connection, battery empty, ...). Older than 1800 s from minute 31, plus
  # "for: 5m". The heartbeat keeps moving, so only this rule may fire.
  - interval: 1m
    input_series:
      - series: atmotube_last_run_timestamp_seconds
        values: "0+60x60"
      - series: atmotube_last_reading_timestamp_seconds
        values: "0x60"
    alert_rule_test:
      - eval_time: 35m
        alertname: AtmotubeNoReadings
        exp_alerts: []
      - eval_time: 37m
        alertname: AtmotubeNoReadings
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: "No readings from the Atmotube for 30 minutes"
              description: "atmotube_bluetooth_up and atmotube_device_seen show where it breaks. More detail: python3 atmotube.py --diagnose"
      - eval_time: 37m
        alertname: AtmotubeExporterStalled
        exp_alerts: []
